# Previs pipeline path-conditional + nightly/manual heavy smoke.
# Lightweight unit coverage always runs on PRs that touch previs/agent paths.
name: Previs pipeline

on:
  pull_request:
    paths:
      - 'scripts/agent/previs.ts'
      - 'scripts/agent/**'
      - 'src/engine/previs/**'
      - 'src/engine/agent/**'
      - 'src/components/**/SceneViewport*'
      - 'src/components/**/viewport*'
      - 'src/engine/renderers.ts'
      - 'examples/previs/**'
      - 'tests/previs*.ts'
      - '.github/workflows/ci-previs.yml'
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

concurrency:
  group: previs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  previs-unit:
    name: Previs unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/previsProduction.test.ts tests/previsComposition.test.ts tests/previsReset.test.ts

  previs-smoke:
    name: Four-shot previs smoke
    # Heavy smoke: manual, nightly, or when explicitly labeled.
    if: >
      github.event_name == 'workflow_dispatch'
      || github.event_name == 'schedule'
      || contains(github.event.pull_request.labels.*.name, 'previs-smoke')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start preview server
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 &
          echo $! > preview.pid
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4173/ >/dev/null; then
              echo "preview ready"
              exit 0
            fi
            sleep 1
          done
          echo "preview failed to start"
          exit 1
      - name: Run four-shot previs fixture
        run: |
          npm run agent:previs -- \
            --manifest examples/previs/minimal-dialogue.json \
            --url http://127.0.0.1:4173 \
            --write \
            --reset-project \
            --headless \
            --output artifacts/previs
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '0'
      - name: Assert clean frames exist
        run: |
          set -euo pipefail
          for n in 010 020 030 040; do
            test -f "artifacts/previs/shots/${n}.png"
            test -f "artifacts/previs/shots/${n}.composition.json"
            # Reject debug paths as production frames
            ! test -f "artifacts/previs/shots/${n}-ui.png"
          done
          test -f artifacts/previs/contact-sheet.png
          test -f artifacts/previs/validation.json
          test -f artifacts/previs/summary.json
          # PNG signature check
          for n in 010 020 030 040; do
            xxd -l 8 -p "artifacts/previs/shots/${n}.png" | grep -q '89504e470d0a1a0a'
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: previs-smoke-artifacts
          path: |
            artifacts/previs/contact-sheet.png
            artifacts/previs/validation.json
            artifacts/previs/summary.json
            artifacts/previs/package.zip
            artifacts/previs/shots/**
            artifacts/previs/debug/**
            artifacts/previs/logs/**
          retention-days: 14
      - name: Stop preview server
        if: always()
        run: |
          if [ -f preview.pid ]; then kill "$(cat preview.pid)" || true; fi
