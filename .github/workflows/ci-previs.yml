# Previs pipeline path-conditional + nightly/manual heavy smoke.
# Lightweight unit coverage always runs when this workflow is triggered.
# Heavy four-shot and imported-character smoke runs on matching PRs
# (path-filtered), nightly, and manual.
name: Previs pipeline

on:
  pull_request:
    paths:
      - 'scripts/agent/previs.ts'
      - 'scripts/agent/**'
      - 'src/engine/previs/**'
      - 'src/engine/agent/**'
      - 'src/engine/poseableCharacterImport.ts'
      - 'src/engine/poseableRigPackage.ts'
      - 'src/components/common/PoseableCharacterImportDialog.tsx'
      - 'src/components/**/SceneViewport*'
      - 'src/components/**/viewport*'
      - 'src/engine/renderers.ts'
      - 'examples/previs/**'
      - 'tests/previs*.ts'
      - 'e2e/previs-imported-character.spec.ts'
      - 'e2e/previs-saved-rig-character.spec.ts'
      - 'e2e/production-rapid-review.spec.ts'
      - 'tests/productionRun.test.ts'
      - 'tests/fixtures/**'
      - 'docs/previs-production-manifest.md'
      - '.grok/skills/forescene-previs/references/**'
      - '.github/workflows/ci-previs.yml'
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

concurrency:
  group: previs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  previs-unit:
    name: Previs unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/previsProduction.test.ts tests/previsComposition.test.ts tests/previsReset.test.ts tests/productionRun.test.ts

  previs-smoke:
    name: Four-shot previs smoke
    # Path filter already scopes PR runs; also nightly + manual.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start preview server
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 &
          echo $! > preview.pid
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4173/ >/dev/null; then
              echo "preview ready"
              exit 0
            fi
            sleep 1
          done
          echo "preview failed to start"
          exit 1
      - name: Run four-shot previs fixture
        run: |
          # Fresh output dir — never reuse old UI-screenshot smoke artifacts.
          rm -rf artifacts/previs-smoke
          npm run agent:previs -- \
            --manifest examples/previs/minimal-dialogue.json \
            --url http://127.0.0.1:4173 \
            --profile artifacts/previs-smoke/browser-profile \
            --write \
            --reset-project \
            --headless \
            --output artifacts/previs-smoke
      - name: Assert clean frames + composition quality
        run: |
          set -euo pipefail
          for n in 010 020 030 040; do
            test -f "artifacts/previs-smoke/shots/${n}.png"
            test -f "artifacts/previs-smoke/shots/${n}.composition.json"
            # Reject debug paths as production frames
            ! test -f "artifacts/previs-smoke/shots/${n}-ui.png"
          done
          test -f artifacts/previs-smoke/contact-sheet.png
          test -f artifacts/previs-smoke/validation.json
          test -f artifacts/previs-smoke/summary.json
          # PNG signature check
          for n in 010 020 030 040; do
            xxd -l 8 -p "artifacts/previs-smoke/shots/${n}.png" | grep -q '89504e470d0a1a0a'
          done
          # Strong geometric / validation gates
          npx tsx scripts/agent/assertPrevisSmoke.ts --dir artifacts/previs-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: previs-smoke-artifacts
          path: |
            artifacts/previs-smoke/contact-sheet.png
            artifacts/previs-smoke/validation.json
            artifacts/previs-smoke/summary.json
            artifacts/previs-smoke/package.zip
            artifacts/previs-smoke/run-state.json
            artifacts/previs-smoke/shots/**
            artifacts/previs-smoke/debug/**
            artifacts/previs-smoke/logs/**
          retention-days: 14
      - name: Stop preview server
        if: always()
        run: |
          if [ -f preview.pid ]; then kill "$(cat preview.pid)" || true; fi

  production-rapid-review:
    name: Production rapid-review E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Run production rapid-review E2E
        run: npx playwright test e2e/production-rapid-review.spec.ts --project=desktop-chromium
        env:
          PLAYWRIGHT_SKIP_BUILD: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: production-rapid-review-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  previs-imported-character:
    name: Imported-character Chromium E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Run imported-character manifest fixtures
        run: npx playwright test e2e/previs-imported-character.spec.ts e2e/previs-saved-rig-character.spec.ts --project=desktop-chromium
        env:
          PLAYWRIGHT_SKIP_BUILD: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: previs-imported-character-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 7
