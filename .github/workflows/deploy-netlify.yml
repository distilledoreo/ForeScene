name: Manual Netlify deploy
# Deployment trigger: Verify OAuth callbacks using an isolated loopback receiver

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-netlify.yml

permissions:
  contents: read

concurrency:
  group: netlify-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_TARGET: forescene.distilledlabs.org

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify Netlify credentials
        shell: bash
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret NETLIFY_AUTH_TOKEN."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build ForeScene locally on runner
        run: npm run build

      - name: Deploy prebuilt site and functions to Netlify production
        shell: bash
        run: |
          npx --yes netlify-cli@latest deploy \
            --dir=dist \
            --functions=netlify/functions \
            --prod \
            --site "$NETLIFY_SITE_TARGET" \
            --auth "$NETLIFY_AUTH_TOKEN" \
            --message "ForeScene ${GITHUB_SHA}"

      - name: Install Chromium for OAuth consent verification
        run: npx playwright install --with-deps chromium

      - name: Verify production OAuth flow in Chromium
        run: node scripts/remote-mcp-oauth-smoke.mjs https://forescene.distilledlabs.org --browser
