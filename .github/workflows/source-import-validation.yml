name: Source import final validation

on:
  push:
    branches: [feature/source-preserving-import]
    paths:
      - '.github/workflows/source-import-validation.yml'

permissions:
  contents: write

jobs:
  validate:
    if: github.ref == 'refs/heads/feature/source-preserving-import'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/source-preserving-import
      - name: Apply tested review fixes and remove temporary transport
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, subprocess
          patch = pathlib.Path('.github/source-import-review.patch')
          if hashlib.sha256(patch.read_bytes()).hexdigest() != '89b969ec3ec47c0673378f3e9043142b27fdb48197caca19215050e0d381d31b':
              raise SystemExit('Review patch checksum mismatch.')
          subprocess.run(['git', 'apply', '--check', str(patch)], check=True)
          subprocess.run(['git', 'apply', '--index', str(patch)], check=True)
          subprocess.run(['git', 'rm', str(patch), '.github/workflows/source-import-validation.yml'], check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: pin source assets through hydration and preserve instanced morph occlusion'
          git push origin HEAD:feature/source-preserving-import
          mkdir -p validation-results
          git rev-parse HEAD | tee validation-results/implementation-commit.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: TypeScript
        id: types
        continue-on-error: true
        run: npm run lint 2>&1 | tee validation-results/types.log
      - name: Full fast unit suite
        id: units
        continue-on-error: true
        run: npm test -- --maxWorkers=2 2>&1 | tee validation-results/units.log
      - name: Production build
        id: build
        continue-on-error: true
        run: npm run build 2>&1 | tee validation-results/build.log
      - name: WebGL browser regression suite
        id: browser
        continue-on-error: true
        run: npm run test:browser -- --maxWorkers=1 2>&1 | tee validation-results/browser.log
      - name: Preserve pixel evidence
        if: always()
        run: |
          if [ -d test-results/source-model ]; then cp -R test-results/source-model validation-results/source-model; fi
      - name: Source-preserving import interactive acceptance
        id: feature
        continue-on-error: true
        env:
          PLAYWRIGHT_SKIP_BUILD: '1'
        run: npx playwright test e2e/source-preserving-import.spec.ts --project=desktop-chromium --workers=1 2>&1 | tee validation-results/feature-e2e.log
      - name: Record outcomes
        if: always()
        env:
          TYPES: ${{ steps.types.outcome }}
          UNITS: ${{ steps.units.outcome }}
          BUILD: ${{ steps.build.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
          FEATURE: ${{ steps.feature.outcome }}
        run: |
          mkdir -p validation-results
          python3 - <<'PY'
          import json, os, pathlib
          outcomes = {key: os.environ[key] for key in ['TYPES', 'UNITS', 'BUILD', 'BROWSER', 'FEATURE']}
          pathlib.Path('validation-results/outcomes.json').write_text(json.dumps(outcomes, indent=2))
          print(json.dumps(outcomes, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-import-final-validation
          path: |
            validation-results/
            test-results/
            playwright-report/
          retention-days: 7
      - name: Require all validation gates
        if: always()
        run: |
          python3 - <<'PY'
          import json, pathlib
          results = json.loads(pathlib.Path('validation-results/outcomes.json').read_text())
          if any(value != 'success' for value in results.values()):
              raise SystemExit('One or more final validation gates did not pass.')
          PY
