name: Apply PR95 targeted fix

on:
  push:
    branches:
      - feature/first-project-launcher

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: apply PR95 targeted fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/first-project-launcher
          fetch-depth: 0

      - name: Patch lifecycle and focused smoke test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          lifecycle_path = Path('src/hooks/useProjectLifecycle.ts')
          lifecycle = lifecycle_path.read_text()

          old_import = "import type { LocationProject } from '../domain/types';\nimport { createDefaultProject } from '../domain/defaults';"
          new_import = "import type { LocationProject } from '../domain/types';\nimport { isEffectivelyBlankProject } from '../domain/blankProject';\nimport { createDefaultProject } from '../domain/defaults';"
          if old_import not in lifecycle:
              raise SystemExit('Lifecycle import anchor not found')
          lifecycle = lifecycle.replace(old_import, new_import, 1)

          old_snapshot = """    const current = useProjectStore.getState().project;
    await controller.createSnapshot(current, `Before: ${reason}`);
    await controller.commitProject(next, {
"""
          new_snapshot = """    const current = useProjectStore.getState().project;
    // A pristine launcher scaffold has no user work to protect. Skipping this
    // redundant snapshot removes an extra revision boundary from first-project
    // activation while all non-blank replacements retain the recovery point.
    if (!isEffectivelyBlankProject(current)) {
      await controller.createSnapshot(current, `Before: ${reason}`);
    }
    await controller.commitProject(next, {
"""
          if old_snapshot not in lifecycle:
              raise SystemExit('Snapshot anchor not found')
          lifecycle = lifecycle.replace(old_snapshot, new_snapshot, 1)

          old_sample = """  const loadSampleProject = async (sampleId: string): Promise<boolean> => {
    setProjectImportStatus(undefined);
    try {
      const sample = loadBundledSample(sampleId);
      await commitAndActivateProject(
        sample,
        `Loaded sample: ${sample.name}`,
        `Opened sample “${sample.name}”. Explore Build → Reference → Shots → Export. Use Reset sample anytime to restore the baseline.`,
      );
      return true;
    } catch (error) {
      setProjectImportStatus({
        tone: 'error',
        message: error instanceof Error
          ? `Could not load sample: ${error.message}`
          : 'Could not load sample.',
      });
      return false;
    }
  };
"""
          new_sample = """  const loadSampleProject = async (sampleId: string): Promise<boolean> => {
    setProjectImportStatus(undefined);

    const activateSample = async () => {
      const sample = loadBundledSample(sampleId);
      await commitAndActivateProject(
        sample,
        `Loaded sample: ${sample.name}`,
        `Opened sample “${sample.name}”. Explore Build → Reference → Shots → Export. Use Reset sample anytime to restore the baseline.`,
      );
    };

    try {
      await activateSample();
      return true;
    } catch (firstError) {
      // Browser-backed local storage can transiently abort a transaction while
      // its connection settles. The bundled sample is deterministic and small,
      // so retry the complete verified activation once after the write queue is idle.
      try {
        await awaitProjectWriteIdle();
        await activateSample();
        return true;
      } catch (retryError) {
        setProjectImportStatus({
          tone: 'error',
          message: retryError instanceof Error
            ? `Could not load sample: ${retryError.message}`
            : firstError instanceof Error
              ? `Could not load sample: ${firstError.message}`
              : 'Could not load sample.',
        });
        return false;
      }
    }
  };
"""
          if old_sample not in lifecycle:
              raise SystemExit('Sample loader anchor not found')
          lifecycle = lifecycle.replace(old_sample, new_sample, 1)
          lifecycle_path.write_text(lifecycle)

          smoke_path = Path('e2e/project-launcher.spec.ts')
          smoke = smoke_path.read_text()
          redundant = """    await goToWorkspace(page, 'Shots', '[data-shots-camera-shell]');
    await expect(page.locator('[data-shots-camera-shell]')).toBeVisible();
    await dismissOverlays(page);
"""
          replacement = """    await goToWorkspace(page, 'Shots', '[data-shots-camera-shell]');
    // goToWorkspace already waits for the shell. Dismiss guidance before the
    // next navigation instead of racing a duplicate assertion against its modal.
    await dismissOverlays(page);
"""
          if redundant not in smoke:
              raise SystemExit('Shots assertion anchor not found')
          smoke_path.write_text(smoke.replace(redundant, replacement, 1))
          PY

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/pr95-targeted-fix.yml
          git config user.name "OpenAI"
          git config user.email "openai@users.noreply.github.com"
          git add src/hooks/useProjectLifecycle.ts e2e/project-launcher.spec.ts
          git commit -m "Fix first-project sample activation race"
          git push origin HEAD:feature/first-project-launcher
